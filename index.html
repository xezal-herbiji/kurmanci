<style>.hero::before{height:calc(10px + env(safe-area-inset-top))}.wrap{padding-bottom:calc(60px + env(safe-area-inset-bottom))}
.hero .in{padding-left:max(4vw,16px,env(safe-area-inset-left));padding-right:max(4vw,16px,env(safe-area-inset-right))}</style>
<title>Kurmancî lernen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: freundlicher Sprachkurs, ruhig und klar, ermutigend
   IDEA: ein Schulheft für die Berge – Zozan-Weide, Sonne, Buchstaben wie auf Tafeln
   PICTURE: Bergband mit Sonne oben, darunter die Lern-Werkzeuge selbst
   COLOUR and TYPE: tiefes Grün (Berge), Sonnengelb, Akzent Orange; Rubik + Noto Sans (alle Sonderzeichen)
   LAYOUT: eine Spalte, große Tafeln/Kacheln, Übungen zentriert, mobil zuerst */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0f1712);--ink:light-dark(#14201a,#e8efe9);--mut:light-dark(#5b6b62,#9fb3a7);
--card:light-dark(#f3f7f4,#17231c);--line:light-dark(#dbe5de,#2a3a31);
--g:light-dark(#14532d,#1f6b3f);--g2:light-dark(#e3f1e7,#173524);--sun:#f5b301;--red:light-dark(#c81e2a,#e0413c);--acc:#c2410c;--ok:#15803d;--bad:#b91c1c}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Rubik,"Noto Sans",sans-serif;line-height:1.1;margin:0 0 .4em}
h1{font-size:clamp(30px,6vw,44px)}h2{font-size:26px}h3{font-size:19px}
a{color:var(--g)}:root[data-theme=dark] a{color:#7fd3a0}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) a{color:#7fd3a0}}
.hero{background:var(--g);color:#fff;position:relative;overflow:hidden}
.hero .in{max-width:880px;margin:0 auto;padding:22px max(4vw,16px) 0;position:relative;z-index:1}
.hero p{margin:0;opacity:.9;max-width:52ch}
.hero svg.land{display:block;width:100%;height:170px;margin-top:-10px}
.hero::before{content:"";display:block;height:10px;background:var(--red);box-shadow:0 3px 0 #fff}
.wrap{max-width:880px;margin:0 auto;padding:22px max(4vw,16px) 60px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
nav.tabs a{color:#fff;text-decoration:none;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.14);font-weight:600;font-size:15px}
nav.tabs a.on{background:var(--sun);color:#1a1300}
button,.btn{font:600 16px "Noto Sans",sans-serif;min-height:44px;padding:10px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button.pri{background:var(--red);border-color:var(--red);color:#fff}
button.sun{background:var(--sun);border-color:var(--sun);color:#1a1300}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.lesson{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.lesson .big{font:700 34px Rubik,sans-serif;color:var(--red)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--sun)}
.small{font-size:14px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.tile{font:700 26px Rubik,sans-serif;aspect-ratio:1;border-radius:14px;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;cursor:pointer;position:relative;padding:0}
.tile small{position:absolute;bottom:4px;right:7px;font:600 11px "Noto Sans";color:var(--mut)}
.tile.v{background:var(--g2)}
.tile:hover{border-color:var(--red)}
.detail .L{color:var(--red)}
h2{border-bottom:3px solid var(--red);display:inline-block;padding-bottom:4px}
.caption{font-size:13px;color:var(--mut);margin:16px 0 0}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px;margin-top:14px}.figs>div{background:#fff;border-radius:14px;padding:6px;border:2px solid var(--line)}.figs svg{display:block;width:100%;height:auto}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}.plan>div{background:var(--card);border-radius:16px;padding:14px 16px}.plan ol{margin:0;padding-left:28px}.plan li{padding:3px 0}.plan .soon{color:var(--mut)}.plan .ok{color:var(--ok);font-weight:700}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;background:var(--card);border-radius:20px;padding:20px;margin-top:18px;border:2px solid var(--line)}
.detail .L{font:700 72px/1 Rubik,sans-serif}
.detail .fig{background:#fff;border-radius:14px;padding:8px;align-self:start}
.ipa{font-size:20px;color:var(--mut)}
.warn{background:light-dark(#fff4e5,#3a2a10);border-left:4px solid var(--red);padding:8px 12px;border-radius:8px;margin:10px 0}
.words{display:grid;gap:8px;margin-top:10px}
.word{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:8px 12px;border:1px solid var(--line)}
.word b{font-size:20px}
.ib{min-height:40px;padding:6px 12px;font-size:14px}
.quiz{max-width:620px;margin:0 auto}
.qcard{background:var(--card);border-radius:20px;padding:22px;border:2px solid var(--line);margin-top:14px}
.qtype{font-size:13px;color:var(--mut);font-weight:600}
.prompt{font:600 22px/1.3 Rubik,sans-serif;margin:8px 0 16px}
.prompt .giant{font-size:72px;display:block;text-align:center}
.opts{display:grid;gap:10px}
.opts button{text-align:left;font-size:18px}
.opts button.ok{border-color:var(--ok);background:light-dark(#e7f6ec,#143323)}
.opts button.no{border-color:var(--bad);background:light-dark(#fdecec,#3a1616)}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:600}
.fb.ok{background:light-dark(#e7f6ec,#143323);color:var(--ok)}.fb.no{background:light-dark(#fdecec,#3a1616);color:var(--bad)}
input.t{width:100%;font:500 20px "Noto Sans";padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.keys button{min-width:48px;font-size:20px;padding:6px 10px}
.pool,.built{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px;border-radius:12px}
.built{border:2px dashed var(--line);margin-bottom:10px}
.pool button,.built button{font-size:18px}
.rec{display:inline-flex;align-items:center;gap:6px}.rec.on{background:var(--bad);border-color:var(--bad);color:#fff}
.list{display:grid;gap:6px}
.li{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--card)}
.li code{font-size:13px;color:var(--mut)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--line);margin-right:6px}.dot.on{background:var(--ok)}
.note{background:var(--g2);border-radius:14px;padding:14px 16px;margin:14px 0}
.hide{display:none}
@media(max-width:600px){.detail{grid-template-columns:1fr}.li{grid-template-columns:1fr}.prompt .giant{font-size:60px}}
@media(prefers-reduced-motion:no-preference){.qcard.anim{animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:0}}}
</style>
</head>

· we euer · wan ihr (Pl.)<\/text><text x=\"270\" y=\"288\" font-size=\"13\" fill=\"#c81e2a\" font-weight=\"700\" text-anchor=\"middle\">Achtung: dê (Mutter) wird zu diya → diya min<\/text><\/svg>"], "link": ["https://en.wikipedia.org/wiki/Ezafe", "Izafe erklärt (Wikipedia)"], "items": [{"id": "L5-00", "kmr": "malbat", "de": "Familie", "note": ""}, {"id": "L5-01", "kmr": "bapîr", "de": "Großvater", "note": ""}, {"id": "L5-02", "kmr": "dapîr", "de": "Großmutter", "note": ""}, {"id": "L5-03", "kmr": "xal", "de": "Onkel (Bruder der Mutter)", "note": ""}, {"id": "L5-04", "kmr": "met", "de": "Tante (Schwester des Vaters)", "note": ""}, {"id": "L5-05", "kmr": "bavê min", "de": "mein Vater", "note": "männlich → ê"}, {"id": "L5-06", "kmr": "diya min", "de": "meine Mutter", "note": "dê wird zu diya"}, {"id": "L5-07", "kmr": "birayê min", "de": "mein Bruder", "note": "bira + y + ê"}, {"id": "L5-08", "kmr": "xwişka min", "de": "meine Schwester", "note": "weiblich → a"}, {"id": "L5-09", "kmr": "kurê wê", "de": "ihr Sohn", "note": "wê = ihr (von einer Frau)"}, {"id": "L5-10", "kmr": "keça wî", "de": "seine Tochter", "note": "wî = sein (von einem Mann)"}, {"id": "L5-11", "kmr": "malbata me", "de": "unsere Familie", "note": ""}, {"id": "L5-12", "kmr": "apê min", "de": "mein Onkel (Bruder des Vaters)", "note": ""}, {"id": "L5-13", "kmr": "Ev diya min e.", "de": "Das ist meine Mutter.", "note": ""}, {"id": "L5-14", "kmr": "Navê bavê min Ehmed e.", "de": "Mein Vater heißt Ehmed.", "note": "wörtlich: „Der Name meines Vaters ist Ehmed.“"}, {"id": "L5-15", "kmr": "Du xwişkên min hene.", "de": "Ich habe zwei Schwestern.", "note": "wörtlich: „Zwei Schwestern von mir gibt es.“ – ên = Mehrzahl"}], "rules": [["Welche Izafe-Endung bekommt ein <b>männliches<\/b> Wort?", "<b>-ê<\/b> → bavê min"], ["Welche Izafe-Endung bekommt ein <b>weibliches<\/b> Wort?", "<b>-a<\/b> → xwişka min"], ["Welche Izafe-Endung steht in der <b>Mehrzahl<\/b>?", "<b>-ên<\/b> → xwişkên min"], ["Was wird aus <b>dê<\/b> (Mutter) mit Besitzer?", "<b>diya<\/b> → diya min"], ["Was ist der Unterschied zwischen <b>ap<\/b> und <b>xal<\/b>?", "ap = Bruder des Vaters, xal = Bruder der Mutter"], ["Wie heißen die Besitzwörter (mein, dein, sein, ihr …)?", "min, te, wî, wê, me, we, wan"]]}, {"id": "l6", "n": 6, "title": "Fragen stellen", "big": "Çi? Kî?", "short": "Wer, was, wo, wann, wie, warum", "intro": "<p>Fragewörter stehen meist dort, wo im Antwortsatz die Antwort steht: <b>Ew kî ye?<\/b> – <b>Ew Rojda ye.<\/b> Mit diesen Sätzen kannst du auch nachfragen, wenn du etwas nicht verstehst.<\/p>", "svgs": ["<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 520 360\" width=\"520\" style=\"max-width:100%;height:auto\" role=\"img\" aria-label=\"Kurdische Fragewörter\" font-family=\"Noto Sans, Arial, sans-serif\"><rect width=\"520\" height=\"360\" rx=\"14\" fill=\"#fff\"/><text x=\"260\" y=\"26\" font-size=\"16\" fill=\"#1f2937\" font-weight=\"700\" text-anchor=\"middle\">Fragewörter<\/text><path d=\"M260 196L260 68\" stroke=\"#cbd5e1\" stroke-width=\"2\"/><rect x=\"210\" y=\"44\" width=\"100\" height=\"48\" rx=\"12\" fill=\"#f3f7f4\" stroke=\"#cbd5e1\"/><text x=\"260\" y=\"66\" font-size=\"17\" fill=\"#c81e2a\" font-weight=\"700\" text-anchor=\"middle\">kî<\/text><text x=\"260\" y=\"84\" font-size=\"11.5\" fill=\"#64748b\" font-weight=\"400\" text-anchor=\"middle\">wer?<\/text><path d=\"M260 196L366 105\" stroke=\"#cbd5e1\" stroke-width=\"2\"/><rect x=\"316\" y=\"81\" width=\"100\" height=\"48\" rx=\"12\" fill=\"#f3f7f4\" stroke=\"#cbd5e1\"/><text x=\"366\" y=\"103\" font-size=\"17\" fill=\"#c81e2a\" font-weight=\"700\" text-anchor=\"middle\">çi<\/text><text x=\"366\" y=\"121\" font-size=\"11.5\" fill=\"#64748b\" font-weight=\"400\" text-anchor=\"middle\">was?<\/text><path d=\"M260 196L410 196\" stroke=\"#cbd5e1\" stroke-width=\"2\"/><rect x=\"360\" y=\"172\" width=\"100\" height=\"48\" rx=\"12\" fill=\"#f3f7f4\" stroke=\"#cbd5e1\"/><text x=\"410\" y=\"194\" font-size=\"17\" fill=\"#c81e2a\" "#c81e2a\" font-weight=\"700\" text-anchor=\"middle\">çend<\/text><text x=\"154\" y=\"121\" font-size=\"11.5\" fill=\"#64748b\" font-weight=\"400\" text-anchor=\"middle\">wie viele?<\/text><circle cx=\"260\" cy=\"196\" r=\"34\" fill=\"#f5b301\"/><text x=\"260\" y=\"208\" font-size=\"34\" fill=\"#1f2937\" font-weight=\"700\" text-anchor=\"middle\">?<\/text><\/svg>"], "link": ["https://kurdishlessons.com/80-everyday-kurdish-expressions/", "Mehr Alltagsausdrücke"], "items": [{"id": "L6-00", "kmr": "kî", "de": "wer", "note": ""}, {"id": "L6-01", "kmr": "çi", "de": "was", "note": ""}, {"id": "L6-02", "kmr": "li ku", "de": "wo", "note": ""}, {"id": "L6-03", "kmr": "ji ku", "de": "woher", "note": ""}, {"id": "L6-04", "kmr": "kengî", "de": "wann", "note": ""}, {"id": "L6-05", "kmr": "çawa", "de": "wie", "note": ""}, {"id": "L6-06", "kmr": "çima", "de": "warum", "note": ""}, {"id": "L6-07", "kmr": "Ev çi ye?", "de": "Was ist das?", "note": ""}, {"id": "L6-08", "kmr": "Ev pirtûk e.", "de": "Das ist ein Buch.", "note": ""}, {"id": "L6-09", "kmr": "Ew kî ye?", "de": "Wer ist das?", "note": ""}, {"id": "L6-10", "kmr": "Tu li ku yî?", "de": "Wo bist du?", "note": ""}, {"id": "L6-11", "kmr": "Mala te li ku ye?", "de": "Wo ist dein Zuhause?", "note": "mal + a + te"}, {"id": "L6-12", "kmr": "Tu kengî têyî?", "de": "Wann kommst du?", "note": ""}, {"id": "L6-13", "kmr": "Hewa çawa ye?", "de": "Wie ist das Wetter?", "note": ""}, {"id": "L6-14", "kmr": "Ez nizanim.", "de": "Ich weiß es nicht.", "note": ""}, {"id": "L6-15", "kmr": "Ji kerema xwe, dîsa bêje.", "de": "Sag es bitte noch einmal.", "note": "ji kerema xwe = bitte"}, {"id": "L6-16", "kmr": "Ji kerema xwe, hêdî biaxive.", "de": "Sprich bitte langsam.", "note": ""}, {"id": "L6-17", "kmr": "Ev bi kurdî çi ye?", "de": "Wie heißt das auf Kurdisch?", "note": ""}], "rules": [["Wo steht das Fragewort im Satz?", "meist dort, wo in der Antwort die Antwort steht: Ew <b>kî<\/b> ye? – Ew <b>Rojda<\/b> ye."], ["Wie sagst du „bitte“?", "<b>ji kerema xwe<\/b>"], ["Was ist der Unterschied zwischen <b>li ku<\/b> und <b>ji ku<\/b>?", "li ku = wo, ji ku = woher"]]}], "roadmap": [["A1 · Grundlagen", [[1, "Alphabet & Aussprache"], [2, "Begrüßen & Vorstellen"], [3, "Zahlen 0–20"], [4, "Ich bin … („sein“)"], [5, "Familie & „mein, dein“"], [6, "Fragen stellen"], [7, "Zahlen bis 1000 & Uhrzeit"], [8, "Essen & Trinken"], [9, "Gegenwart: regelmäßige Verben"], [10, "Tage, Monate, Jahreszeiten"], [11, "Haus & Dorf"], [12, "Wiederholung A1: erstes Gespräch"]]], ["A2 · Alltag", [[13, "Farben & Eigenschaften"], [14, "Körper & Gesundheit"], [15, "„haben“ & unregelmäßige Verben"], [16, "wollen, können, müssen"], [17, "Orte: in, auf, aus, mit"], [18, "Bitten & Befehle"], [19, "Vergangenheit I (ich ging)"], [20, "Vergangenheit II: Ergativ (ich sah)"], [21, "Einkaufen & Geld"], [22, "Wetter & Natur"], [23, "Zukunft"], [24, "Wiederholung A2: erzählen, was war"]]], ["B1 · Selbstständig", [[25, "Perfekt"], [26, "Plusquamperfekt"], [27, "Gefühle & Meinungen"], [28, "Studium & Arbeit"], [29, "Reisen"], [30, "Nebensätze mit ku"], [31, "Wenn … dann (eger)"], [32, "Passiv"], [33, "Märchen & Geschichten (çîrok)"], [34, "Musik & Kultur: Dengbêj"], [35, "Diskutieren"], [36, "Abschluss: freies Sprechen"]]]]};
</script>
<script>
{
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const fold = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ı/g, 'i');
const norm = s => s.toLowerCase().replace(/[!?.,…¡¿]/g, '').replace(/\s+/g, ' ').trim();

// ---------- Inhalte ----------
const L = DATA.letters;
const WORDS = L.flatMap(l => l.words.map(w => ({...w, letter: l.upper})));
const LES = DATA.lessons; const LBY = Object.fromEntries(LES.map(l => [l.id, l]));
const slug = s => norm(s).replace(/ /g, '-');
const ITEMS = [
  ...L.map(l => ({id: l.id, kmr: l.upper + ' ' + l.lower, de: 'Buchstabe ' + l.upper, file: 'buchstabe-' + l.lower, group: 'Lektion 1 · Buchstaben'})),
  ...WORDS.map(w => ({id: w.id, kmr: w.kmr, de: w.de, file: w.kmr, group: 'Lektion 1 · Wörter', link: w.link})),
  ...LES.flatMap(les => les.items.map(p => ({id: p.id, kmr: p.kmr, de: p.de, file: slug(p.kmr.replace('…', 'x')), group: `Lektion ${les.n} · ${les.title}`}))),
];
const BYID = Object.fromEntries(ITEMS.map(i => [i.id, i]));

// ---------- Speicher ----------
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('kmr-' + k)) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('kmr-' + k, JSON.stringify(v)); } catch (e) {} }
};
let dbp = null;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => {
    try { const r = indexedDB.open('kmr-audio', 1); r.onupgradeneeded = () => r.result.createObjectStore('a'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
    catch (e) { rej(e); }
  });
  return dbp;
}
async function tx(mode, fn) { const d = await db(); return new Promise((res, rej) => { const t = d.transaction('a', mode); const r = fn(t.objectStore('a')); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); }
const audioGet = id => tx('readonly', s => s.get(id)).catch(() => null);
const audioPut = (id, b) => tx('readwrite', s => s.put(b, id));
const audioDel = id => tx('readwrite', s => s.delete(id));
let HAVE = new Set();
async function refreshHave() { try { const k = await tx('readonly', s => s.getAllKeys()); HAVE = new Set(k || []); } catch (e) { HAVE = new Set(); } }

let cur = null;
async function playBlob(b) { if (!b) return; try { if (cur) cur.pause(); cur = new Audio(URL.createObjectURL(b)); await cur.play(); await new Promise(r => cur.onended = r); } catch (e) {} }
async function playId(id) { const b = await audioGet(id); if (b) await playBlob(b); }

// Aufnahme: Mikrofon, sonst Dateiauswahl (z. B. Sprachmemo)
let micOK = !!(navigator.mediaDevices && window.MediaRecorder);
let recState = null;
async function record(btn) {
  if (recState) { recState.rec.stop(); return null; }
  if (micOK) {
    try {
      const st = await navigator.mediaDevices.getUserMedia({audio: true});
      const rec = new MediaRecorder(st); const parts = [];
      return await new Promise(res => {
        rec.ondataavailable = e => parts.push(e.data);
        rec.onstop = () => { st.getTracks().forEach(t => t.stop()); btn.classList.remove('on'); btn.textContent = '● Aufnehmen'; recState = null; res(new Blob(parts, {type: rec.mimeType || 'audio/webm'})); };
        recState = {rec}; rec.start(); btn.classList.add('on'); btn.textContent = '■ Stopp';
      });
    } catch (e) { micOK = false; }
  }
  return pickFile();
}
function pickFile() {
  return new Promise(res => { const f = $('#filepick'); f.value = ''; f.onchange = () => res(f.files[0] || null); f.click(); });
}

// ---------- Fortschritt ----------
function progress(lesson) { return store.get('prog', {})[lesson] || {best: 0, runs: 0}; }
function saveRun(lesson, pct) { const p = store.get('prog', {}); const o = p[lesson] || {best: 0, runs: 0}; p[lesson] = {best: Math.max(o.best, pct), runs: o.runs + 1}; store.set('prog', p); }
function markWrong(id, wrong) { const w = new Set(store.get('wrong', [])); wrong ? w.add(id) : w.delete(id); store.set('wrong', [...w]); }

// ---------- Ansichten ----------
const app = $('#app');
let detailLetter = null;

function lessonTile(id, n, big, title, short) {
  const p = progress(id);
  return `<div class="lesson"><div class="big">${esc(big)}</div><h3>Lektion ${n} · ${esc(title)}</h3><p class="small">${esc(short)}</p>
    <div class="bar"><i style="width:${p.best}%"></i></div><p class="small">Bestes Ergebnis: ${p.best}% · ${p.runs} Übungsrunden</p>
    <div class="row"><button data-go="${id}">Lernen</button><button class="pri" data-quiz="${id}">Üben</button></div></div>`;
}
function viewStart() {
  const nW = store.get('wrong', []).length, done = new Set(['l1', ...LES.map(l => l.id)]);
  app.innerHTML = `
  <div class="lessons">${lessonTile('l1', 1, 'a b c ç', 'Alphabet & Aussprache', '31 Buchstaben, 62 erste Wörter, mit Mundschnitt und Vokalviereck.')}
    ${LES.map(l => lessonTile(l.id, l.n, l.big, l.title, l.short)).join('')}</div>
  <div class="note"><b>So lernst du am besten:</b> Lektion für Lektion: erst „Lernen“ (Schaubilder anschauen, laut lesen), dann mehrere kurze Übungsrunden. Was du falsch hattest, landet unter „Fehler üben“ (gerade ${nW}). ${HAVE.size ? `Du hast ${HAVE.size} Aufnahmen gespeichert.` : 'Unter „Aufnahmen“ kannst du die Stimme deiner Sprecherin oder deines Sprechers einfügen, dann gibt es Hör- und Nachsprech-Übungen mit Vorbild.'}</div>
  <h2 style="margin-top:20px">Der Weg zu B1</h2>
  <div class="plan">${DATA.roadmap.map(([lvl, ls]) => `<div><h3>${esc(lvl)}</h3><ol>${ls.map(([n, t]) => {
      const id = 'l' + n; return done.has(id) ? `<li value="${n}"><a href="#${id}">${esc(t)}</a> <span class="ok">✓</span></li>` : `<li value="${n}" class="soon">${esc(t)}</li>`; }).join('')}</ol></div>`).join('')}</div>
  <p class="caption">Oben: die Hochebene bei Sevdilli (Elbistan) mit Weizenfeldern, Pappeln, flachen Dorfhäusern, der Ruine des alten Sevdilli-Hans und Mohnblumen.</p>`;
}

function lessonNav(n) {
  const ids = ['l1', ...LES.map(l => l.id)]; const i = ids.indexOf('l' + n);
  return `<div class="row" style="justify-content:space-between;margin-top:18px">${i > 0 ? `<button data-go="${ids[i - 1]}">‹ Lektion ${n - 1}</button>` : '<span></span>'}
    <button class="pri" data-quiz="l${n}">Jetzt üben</button>${i < ids.length - 1 ? `<button data-go="${ids[i + 1]}">Lektion ${n + 1} ›</button>` : '<span></span>'}</div>`;
}

function letterDetail(l) {
  return `<div class="detail" id="det">
    <div><div class="L">${l.upper} ${l.lower}</div><div class="ipa">Lautschrift [${esc(l.ipa)}] · ${l.vowel ? 'Vokal' : 'Konsonant'}</div>
      <p><b>${esc(l.cmp)}</b><br>${esc(l.desc)}</p>
      ${l.warn ? `<div class="warn">⚠ ${esc(l.warn)}</div>` : ''}
      <div class="row">${HAVE.has(l.id) ? `<button class="ib" data-play="${l.id}">▶ Buchstabe anhören</button>` : ''}<button class="ib" data-speak="${l.id}">Nachsprechen</button></div>
      <div class="words">${l.words.map(w => `<div class="word"><span><b>${esc(w.kmr)}</b> · ${esc(w.de)}</span><span class="row">
        ${HAVE.has(w.id) ? `<button class="ib" data-play="${w.id}">▶</button>` : ''}<button class="ib" data-speak="${w.id}">Nachsprechen</button>
        <a href="${w.link}" target="_blank" rel="noopener">Wiktionary</a></span></div>`).join('')}</div>
      <p class="small"><a href="${l.link}" target="_blank" rel="noopener">Diesen Laut auf Wikipedia anhören</a> (mit Hörbeispiel)</p>
    </div>
    <div class="fig">${l.svg}</div></div>`;
}

function viewL1() {
  const l = detailLetter || L[0];
  app.innerHTML = `<h2>Lektion 1 · Alphabet & Aussprache</h2>
  <p>Kurmancî wird so geschrieben, wie es gesprochen wird: jeder Buchstabe hat genau einen Laut. Tippe auf einen Buchstaben. <span class="small">Grün hinterlegt = Vokal.</span></p>
  <div class="grid">${L.map(x => `<button class="tile ${x.vowel ? 'v' : ''}" data-letter="${x.upper}" aria-label="Buchstabe ${x.upper}">${x.upper}${x.lower}<small>${HAVE.has(x.id) ? '♪' : ''}</small></button>`).join('')}</div>
  ${letterDetail(l)}
  <div class="note">Gut zu wissen: Lange Vokale tragen einen Hut (î, ê, û). <b>c</b> = dsch, <b>ç</b> = tsch, <b>j</b> = stimmhaftes sch, <b>ş</b> = sch, <b>x</b> = ch wie in „Bach“, <b>v</b> = deutsches w, <b>w</b> = englisches w, <b>y</b> = deutsches j. Mehr dazu: <a href="https://r12a.github.io/scripts/latn/kmr" target="_blank" rel="noopener">Kurmancî-Schrift (r12a)</a> · <a href="https://en.wikipedia.org/wiki/Kurdish_alphabets" target="_blank" rel="noopener">Kurdische Alphabete (Wikipedia)</a></div>
  ${lessonNav(1)}`;
}

function viewLesson(les) {

  ${les.svgs.length ? `<div class="figs">${les.svgs.map(x => `<div>${x}</div>`).join('')}</div>` : ''}
  <h3 style="margin-top:18px">Wörter & Sätze</h3>
  <div class="words">${les.items.map(p => `<div class="word"><span><b>${esc(p.kmr)}</b><br>${esc(p.de)}${p.note ? `<br><span class="small">${esc(p.note)}</span>` : ''}</span><span class="row">
    ${HAVE.has(p.id) ? `<button class="ib" data-play="${p.id}">▶</button>` : ''}<button class="ib" data-speak="${p.id}">Nachsprechen</button></span></div>`).join('')}</div>
  ${les.link ? `<p class="small">Mehr dazu: <a href="${les.link[0]}" target="_blank" rel="noopener">${esc(les.link[1])}</a></p>` : ''}

// ---------- Übungen ----------
const CONF = [['C','Ç','J','Ş','Z','S'],['I','Î','E','Ê'],['U','Û','O'],['V','W','F'],['X','H','K','Q','G'],['Y','J','I']];
function confusable(up) { const g = CONF.filter(c => c.includes(up)).flat().filter(x => x !== up); return [...new Set(g)]; }
function distractLetters(l) { const c = confusable(l.upper); const pool = L.filter(x => x.upper !== l.upper); const fromC = pool.filter(x => c.includes(x.upper)); return shuffle([...pick(fromC, 3), ...pick(pool.filter(x => !c.includes(x.upper)), 3)]).slice(0, 3); }

function q_l1() {
  const types = [];
  const l = L[Math.floor(Math.random() * L.length)];
  const w = WORDS[Math.floor(Math.random() * WORDS.length)];
  const dl = distractLetters(l);
  types.push({t: 'Welcher Buchstabe?', p: `Welcher Buchstabe klingt ${esc(l.cmp)}?`, o: shuffle([l, ...dl]).map(x => ({v: x.upper, s: x.upper + ' ' + x.lower})), a: l.upper, id: l.id});
  types.push({t: 'Wie klingt das?', p: `<span class="giant">${l.upper} ${l.lower}</span>`, o: shuffle([l, ...dl]).map(x => ({v: x.upper, s: x.cmp})), a: l.upper, id: l.id});
  types.push({t: 'Was heißt das?', p: `<span class="giant" style="font-size:52px">${esc(w.kmr)}</span>`, o: shuffle([w, ...pick(WORDS.filter(x => x.id !== w.id), 3)]).map(x => ({v: x.id, s: x.de})), a: w.id, id: w.id});
  const wl = L.find(x => x.upper === w.letter); const sim = WORDS.filter(x => x.id !== w.id && (confusable(w.letter).includes(x.letter) || fold(x.kmr) === fold(w.kmr)));
  types.push({t: 'Welches Wort ist richtig?', p: `„${esc(w.de)}“ auf Kurmancî:`, o: shuffle([w, ...pick(sim.length >= 3 ? sim : WORDS.filter(x => x.id !== w.id), 3)]).map(x => ({v: x.id, s: x.kmr})), a: w.id, id: w.id});
  types.push({t: 'Schreiben', write: w.kmr, p: `Schreib auf Kurmancî: „${esc(w.de)}“`, id: w.id});
  if (HAVE.has(w.id)) types.push({t: 'Hören', listen: w.id, p: 'Hör zu: welches Wort ist das?', o: shuffle([w, ...pick(WORDS.filter(x => x.id !== w.id), 3)]).map(x => ({v: x.id, s: x.kmr})), a: w.id, id: w.id});
  if (Math.random() < .25) types.push({t: 'Nachsprechen', speak: w.id, id: w.id});
  return types[Math.floor(Math.random() * types.length)];
}
function q_gen(les, p) {
  const PH = les.items;
  p = p || PH[Math.floor(Math.random() * PH.length)];
  const words = p.kmr.replace(/[!?.]/g, '').split(' ').filter(Boolean);
  const types = [
    {t: 'Was heißt das?', p: `<span style="font-size:${words.length > 1 ? 30 : 48}px">${esc(p.kmr)}</span>`, o: shuffle([p, ...pick(PH.filter(x => x.id !== p.id), 3)]).map(x => ({v: x.id, s: x.de})), a: p.id, id: p.id},
    {t: 'Wie sagt man das?', p: `„${esc(p.de)}“`, o: shuffle([p, ...pick(PH.filter(x => x.id !== p.id), 3)]).map(x => ({v: x.id, s: x.kmr})), a: p.id, id: p.id},
  ];
  if (words.length >= 3) types.push({t: 'Satz bauen', build: words, p: `Bau den Satz: „${esc(p.de)}“`, id: p.id});
  if (words.length <= 2) types.push({t: 'Schreiben', write: p.kmr, p: `Schreib auf Kurmancî: „${esc(p.de)}“`, id: p.id});
  if (HAVE.has(p.id)) types.push({t: 'Hören', listen: p.id, p: 'Hör zu: was wird gesagt?', o: shuffle([p, ...pick(PH.filter(x => x.id !== p.id), 3)]).map(x => ({v: x.id, s: x.de})), a: p.id, id: p.id});
  if (Math.random() < .3) types.push({t: 'Nachsprechen', speak: p.id, id: p.id});
  return types[Math.floor(Math.random() * types.length)];
}
function q_item(id) {
  const les = LES.find(l => l.items.some(i => i.id === id)); if (les) return q_gen(les, les.items.find(i => i.id === id));
  const it = BYID[id];
  if (id.startsWith('L-')) { const l = L.find(x => x.id === id); return {t: 'Welcher Buchstabe?', p: `Welcher Buchstabe klingt ${esc(l.cmp)}?`, o: shuffle([l, ...distractLetters(l)]).map(x => ({v: x.upper, s: x.upper + ' ' + x.lower})), a: l.upper, id}; }
  return Math.random() < .5 ? {t: 'Schreiben', write: it.kmr, p: `Schreib auf Kurmancî: „${esc(it.de)}“`, id}
    : {t: 'Was heißt das?', p: `<span class="giant" style="font-size:52px">${esc(it.kmr)}</span>`, o: shuffle([it, ...pick(WORDS.filter(x => x.id !== id), 3)]).map(x => ({v: x.id, s: x.de})), a: id, id};
}

let S = null; // laufende Übung
function startQuiz(kind) {
  let qs = [];
  if (kind === 'fehler') { const w = store.get('wrong', []); if (!w.length) { app.innerHTML = `<div class="quiz"><div class="qcard"><h3>Keine Fehler offen 🎉</h3><p>Mach eine Übungsrunde in einer Lektion.</p><button data-go="start">Zur Übersicht</button></div></div>`; return; } qs = shuffle(w).slice(0, 12).map(q_item); }
  else { const seen = new Set(); while (qs.length < 12) { const q = kind === 'l1' ? q_l1() : q_gen(LBY[kind]); const key = q.t + q.id; if (!seen.has(key)) { seen.add(key); qs.push(q); } } }
  S = {kind, qs, i: 0, ok: 0};
  renderQ();
}

function renderQ() {
  const q = S.qs[S.i];
  const head = `<div class="row" style="justify-content:space-between"><span class="small">Frage ${S.i + 1} von ${S.qs.length}</span><button class="ib" data-go="${S.kind === 'fehler' ? 'start' : S.kind}">Abbrechen</button></div><div class="bar"><i style="width:${S.i / S.qs.length * 100}%"></i></div>`;
  let body = '';
  if (q.speak) body = speakCard(q.speak);
  else if (q.write) body = `<div class="prompt">${q.p}</div><input class="t" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Antwort">
    <div class="keys">${['ç','ê','î','ş','û'].map(k => `<button data-key="${k}">${k}</button>`).join('')}</div><button class="pri" id="check">Prüfen</button>`;
  else if (q.build) { q.pool = q.pool || shuffle(q.build.map((w, i) => ({w, i}))); q.got = q.got || [];
    body = `<div class="prompt">${q.p}</div><div class="built" id="built">${q.got.map((x, j) => `<button data-un="${j}">${esc(x.w)}</button>`).join('')}</div>
    <div class="pool">${q.pool.map((x, j) => q.got.includes(x) ? '' : `<button data-take="${j}">${esc(x.w)}</button>`).join('')}</div><button class="pri" id="check" ${q.got.length ? '' : 'disabled'}>Prüfen</button>`; }
  else body = `<div class="prompt">${q.p}</div>${q.listen ? `<p><button class="sun" data-play="${q.listen}">▶ Anhören</button></p>` : ''}
    <div class="opts">${q.o.map(o => `<button data-ans="${esc(o.v)}">${esc(o.s)}</button>`).join('')}</div>`;
  app.innerHTML = `<div class="quiz">${head}<div class="qcard ${S.shown === S.i ? '' : 'anim'}"><div class="qtype">${esc(q.t)}</div>${body}<div id="fb"></div></div></div>`;
  const first = S.shown !== S.i; S.shown = S.i;
  if (q.listen && first) playId(q.listen);
  const inp = $('#inp'); if (inp) { inp.focus(); inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#check').click(); } }; }
}

function speakCard(id) {
  const it = BYID[id]; const has = HAVE.has(id);
  return `<div class="prompt" style="text-align:center"><span style="font-size:40px">${esc(it.kmr)}</span><br><span class="small">${esc(it.de)}</span></div>
  <ol class="small"><li>${has ? 'Vorbild anhören' : 'Laut lesen (noch keine Vorbild-Aufnahme – siehe „Aufnahmen“)'}</li><li>Selbst aufnehmen</li><li>Beide vergleichen und ehrlich bewerten</li></ol>
  <div class="row"><button class="sun" data-play="${id}" ${has ? '' : 'disabled'}>▶ Vorbild</button><button class="rec" id="me">● Aufnehmen</button>
  <button id="mine" disabled>▶ Meine Aufnahme</button><button id="both" disabled>▶▶ Beide</button>
  ${it.link ? `<a href="${it.link}" target="_blank" rel="noopener" class="small">Aussprache auf Wiktionary</a>` : ''}</div>
  <p class="small" id="micinfo">${micOK ? '' : 'Mikrofon ist hier nicht verfügbar: „Aufnehmen“ öffnet die Dateiauswahl (am Handy: Sprachaufnahme).'}</p>
  <div class="row" style="margin-top:14px"><button class="pri" data-self="1">✓ Klingt gut</button><button data-self="0">↻ Nochmal üben</button></div>`;
}

function feedback(ok, text) {
  if (ok) S.ok++;
  markWrong(S.qs[S.i].id, !ok);
  $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}">${text}</div><p><button class="pri" id="next">Weiter</button></p>`;
  document.querySelectorAll('[data-ans],[data-key],[data-take],[data-un],#check').forEach(b => b.disabled = true);
  $('#next').focus();
  const q = S.qs[S.i]; if (HAVE.has(q.id)) playId(q.id);
}
function nextQ() {
  S.i++;
  if (S.i < S.qs.length) return renderQ();
  const pct = Math.round(S.ok / S.qs.length * 100);
  if (S.kind !== 'fehler') saveRun(S.kind, pct);
  app.innerHTML = `<div class="quiz"><div class="qcard" style="text-align:center"><div style="font:700 64px Rubik">${pct}%</div>
    <h3>${pct >= 80 ? 'Gelek baş! (Sehr gut!)' : pct >= 50 ? 'Baş e! Weiter so.' : 'Dranbleiben – das wird!'}</h3>
    <p>${S.ok} von ${S.qs.length} richtig.</p><div class="row" style="justify-content:center"><button class="pri" data-quiz="${S.kind}">Noch eine Runde</button><button data-go="start">Übersicht</button></div></div></div>`;
}

let myBlob = null;
app.addEventListener('click', async e => {
  const b = e.target.closest('button,[data-letter]'); if (!b) return;
  const d = b.dataset;
  if (d.letter) { detailLetter = L.find(x => x.upper === d.letter); $('#det').outerHTML = letterDetail(detailLetter); $('#det').scrollIntoView({behavior: 'smooth', block: 'nearest'}); return; }
  if (d.go) { if (location.hash === '#' + d.go) route(); else location.hash = d.go; return; }
  if (d.play) return playId(d.play);
  if (d.quiz) return startQuiz(d.quiz);
  if (d.speak) { S = {kind: location.hash.slice(1) || 'l1', qs: [{t: 'Nachsprechen', speak: d.speak, id: d.speak}], i: 0, ok: 0}; return renderQ(); }
  if (d.ans !== undefined) { const q = S.qs[S.i]; const ok = d.ans === String(q.a); b.classList.add(ok ? 'ok' : 'no');
    if (!ok) document.querySelectorAll('[data-ans]').forEach(x => { if (x.dataset.ans === String(q.a)) x.classList.add('ok'); });
    const right = q.o.find(o => o.v === q.a);
    return feedback(ok, ok ? 'Richtig!' : `Richtig wäre: ${esc(right.s)}`); }
  if (d.key) { const i = $('#inp'); const p = i.selectionStart ?? i.value.length; i.value = i.value.slice(0, p) + d.key + i.value.slice(i.selectionEnd ?? p); i.focus(); i.setSelectionRange(p + 1, p + 1); return; }
  if (d.take !== undefined) { const q = S.qs[S.i]; q.got.push(q.pool[+d.take]); return renderQ(); }
  if (d.un !== undefined) { const q = S.qs[S.i]; q.got.splice(+d.un, 1); return renderQ(); }
  if (b.id === 'check') { const q = S.qs[S.i];
    if (q.write) { const v = norm($('#inp').value), want = norm(q.write);
      if (v === want) return feedback(true, 'Richtig!');
      if (fold(v) === fold(want)) return feedback(false, `Fast! Achte auf die Sonderzeichen: <b>${esc(q.write)}</b>`);
      return feedback(false, `Richtig wäre: <b>${esc(q.write)}</b>`); }
    if (q.build) { const ok = q.got.map(x => x.w).join(' ') === q.build.join(' '); return feedback(ok, ok ? 'Richtig!' : `Richtig wäre: <b>${esc(q.build.join(' '))}</b>`); } }
  if (b.id === 'next') return nextQ();
  if (b.id === 'me') { const blob = await record(b); if (blob) { myBlob = blob; $('#mine').disabled = $('#both').disabled = false; playBlob(blob); } if (!micOK) $('#micinfo').textContent = 'Mikrofon ist hier nicht verfügbar: „Aufnehmen“ öffnet die Dateiauswahl (am Handy: Sprachaufnahme).'; return; }
  if (b.id === 'mine') return playBlob(myBlob);
  if (b.id === 'both') { await playId(S.qs[S.i].speak); await new Promise(r => setTimeout(r, 400)); return playBlob(myBlob); }
  if (d.self !== undefined) { myBlob = null; const ok = d.self === '1'; if (S.qs.length === 1) { markWrong(S.qs[0].id, !ok); return route(); } return feedback(ok, ok ? 'Super, weiter so!' : 'Gemerkt – kommt unter „Fehler üben“ wieder.'); }
  if (d.rec) { const blob = await record(b); if (blob) { await audioPut(d.rec, blob); await refreshHave(); viewAudio(); } return; }
  if (d.file) { const f = await pickFile(); if (f) { await audioPut(d.file, f); await refreshHave(); viewAudio(); } return; }
  if (d.del) { await audioDel(d.del); await refreshHave(); return viewAudio(); }
  if (b.id === 'bulk') { const f = $('#bulkpick'); f.value = ''; f.click(); return; }
  if (b.id === 'copy') { try { await navigator.clipboard.writeText(ITEMS.map(i => `${i.file}\t${i.kmr}\t${i.de}`).join('\n')); b.textContent = 'Kopiert ✓'; } catch (err) { $('#namelist').classList.remove('hide'); } return; }
});

// ---------- Aufnahmen ----------
function viewAudio(msg) {
  const groups = [...new Set(ITEMS.map(i => i.group))];
  app.innerHTML = `<h2>Aufnahmen</h2>
  <div class="note"><b>So kommen echte Stimmen in die App:</b><ol style="margin:6px 0 0;padding-left:20px">
    <li>Deine Sprecherin oder dein Sprecher nimmt jedes Wort einzeln auf, z. B. mit der Sprachmemos-App am iPhone.</li>
    <li>Jede Datei bekommt den Namen aus der grauen Spalte, z. B. <code>çav.m4a</code> oder <code>buchstabe-ç.m4a</code>.</li>
    <li>Hier auf „Viele Dateien hochladen“ tippen und alle auf einmal auswählen – die App ordnet sie selbst zu.</li></ol>
    <p class="small">Du kannst auch einzeln aufnehmen oder eine Datei pro Zeile wählen. Aufnahmen bleiben nur in diesem Browser gespeichert. ${micOK ? '' : 'Direktes Aufnehmen braucht Mikrofonzugriff: Öffne dazu die App-Datei direkt im Browser (Safari/Chrome).'}</p>
    <div class="row"><button class="pri" id="bulk">Viele Dateien hochladen</button><button id="copy">Namensliste kopieren</button></div>
    <pre id="namelist" class="hide" style="white-space:pre-wrap;font-size:13px">${esc(ITEMS.map(i => i.file + ' – ' + i.kmr).join('\n'))}</pre></div>
  ${msg ? `<div class="fb ok">${esc(msg)}</div>` : ''}
  <p><b>${HAVE.size}</b> von ${ITEMS.length} aufgenommen.</p>
  ${groups.map(g => `<h3 style="margin-top:18px">${esc(g)}</h3><div class="list">${ITEMS.filter(i => i.group === g).map(i => `
    <div class="li"><span><span class="dot ${HAVE.has(i.id) ? 'on' : ''}"></span><b>${esc(i.kmr)}</b> · ${esc(i.de)}</span><code>${esc(i.file)}</code>
    <span class="row">${HAVE.has(i.id) ? `<button class="ib" data-play="${i.id}">▶</button><button class="ib" data-del="${i.id}" aria-label="Aufnahme löschen">✕</button>` : ''}
    <button class="ib" data-rec="${i.id}">● Aufnehmen</button><button class="ib" data-file="${i.id}">Datei</button></span></div>`).join('')}</div>`).join('')}`;
}
$('#bulkpick').onchange = async e => {
  const files = [...e.target.files]; let n = 0; const miss = [];
  const exact = new Map(ITEMS.map(i => [norm(i.file).normalize('NFC'), i.id]));
  const loose = new Map(); ITEMS.forEach(i => { const k = fold(norm(i.file)); loose.set(k, loose.has(k) ? null : i.id); });
  for (const f of files) {
    const base = norm(f.name.replace(/\.[^.]+$/, '')).normalize('NFC').replace(/[_ ]/g, '-');
    const id = exact.get(base) || loose.get(fold(base));
    if (id) { await audioPut(id, f); n++; } else miss.push(f.name);
  }
  await refreshHave();
  viewAudio(`${n} Aufnahmen zugeordnet.${miss.length ? ' Nicht erkannt: ' + miss.join(', ') : ''}`);
};

// ---------- Navigation ----------
function route() {
  const h = location.hash.slice(1) || 'start';
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + h));
  if (h === 'l1') viewL1(); else if (LBY[h]) viewLesson(LBY[h]); else if (h === 'aufnahmen') viewAudio(); else if (h === 'fehler') startQuiz('fehler'); else viewStart();
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
$('#tabs').addEventListener('click', e => { const a = e.target.closest('a'); if (a && a.getAttribute('href') === location.hash) { e.preventDefault(); route(); } });
refreshHave().then(route);
}
